<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Notification Preferences</h5>
    </div>
    <div class="card-body">
        <div *ngIf="loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div *ngIf="!loading" class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Event Type</th>
                        <th *ngFor="let channel of notificationChannels" class="text-center">
                            {{ getChannelLabel(channel) }}
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let type of notificationTypes">
                        <td>{{ getTypeLabel(type) }}</td>
                        <td *ngFor="let channel of notificationChannels" class="text-center">
                            <div class="form-check d-inline-block">
                                <input class="form-check-input" type="checkbox"
                                    [(ngModel)]="getPreference(type, channel).isEnabled">
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer text-end">
        <button class="btn btn-secondary me-2" (click)="cancel()" [disabled]="saving">Cancel</button>
        <button class="btn btn-primary" (click)="save()" [disabled]="saving">
            <span *ngIf="saving" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            Save Changes
        </button>
    </div>
</div>
